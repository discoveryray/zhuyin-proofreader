Read AGENTS.md and docs/DEVELOPMENT_REVIEW.md first, then only the relevant contracts linked there. Follow the coordinator's exact branch, fixed baseline, file ownership, scope, phase and correction round. Inspect current HEAD and changes before editing; coordinate shared checkout/index writes and do not revert others' work.
