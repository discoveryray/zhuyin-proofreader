name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate runtime asset integrity
        run: python -m unittest discover -s tests -p "test_runtime_asset_manifest_integrity_v562.py"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run full pytest suite
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -q -rs

      - name: Compile Python sources
        if: ${{ !cancelled() }}
        run: python -m compileall -q -x "(^|[\\/])(\.venv|tmp)([\\/]|$)" .

      - name: Check committed whitespace (pull request)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:BASE_SHA) -or
            [string]::IsNullOrWhiteSpace($env:HEAD_SHA)
          ) {
            Write-Error "Pull request base/head SHA is unavailable."
            exit 1
          }
          git diff --check "$($env:BASE_SHA)...$($env:HEAD_SHA)"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check committed whitespace (push)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -or
            [string]::IsNullOrWhiteSpace($env:AFTER_SHA)
          ) {
            Write-Error "Push before/after SHA is unavailable."
            exit 1
          }
          if ($env:BEFORE_SHA -match '^0+$') {
            $emptyTree = (git hash-object -t tree --stdin).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($emptyTree)) {
              Write-Error "Unable to derive the empty Git tree for an all-zero before SHA."
              exit 1
            }
            git diff --check "$emptyTree..$($env:AFTER_SHA)"
          } else {
            git diff --check "$($env:BEFORE_SHA)..$($env:AFTER_SHA)"
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check committed whitespace (workflow dispatch)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEAD_SHA)) {
            Write-Error "Workflow dispatch HEAD SHA is unavailable."
            exit 1
          }
          git diff --check "$($env:HEAD_SHA)^..$($env:HEAD_SHA)"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check repository working tree
        if: always()
        shell: pwsh
        run: |
          $status = @(git status --short)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $status | ForEach-Object { Write-Output $_ }
          if ($status.Count -ne 0) {
            Write-Error "Repository working tree is not clean."
            exit 1
          }
